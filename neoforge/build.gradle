plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = "Boxlib-$project.name"
            version = rootProject.version
        }
    }

    def user = System.getenv("MAVEN_USER")
    def pass = System.getenv("MAVEN_PASS")

    if (user && pass) {
        repositories {
            maven {
                url = uri("https://maven.boxadactle.dev/releases")
                credentials {
                    username = user
                    password = pass
                }
            }

            maven {
                url = uri("https://maven.boxadactle.dev/snapshots")
                credentials {
                    username = user
                    password = pass
                }
            }
        }
    } else {
        println "Skipping Maven repository upload, no credentials provided."
    }
}